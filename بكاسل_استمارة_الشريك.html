<style>
:root{

  --shadow:0 -3px 14px rgba(0,0,0,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--canvas);color:var(--ink);
  font-family:"Cairo","Inter","Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.8;padding-bottom:120px}
.wrap{max-width:860px;margin:0 auto;padding:0 14px}
header{background:var(--ink);color:#fff;padding:32px 0 26px;margin-bottom:18px}
header h1{margin:0 0 8px;font-size:27px;font-weight:700}
header p{margin:0;opacity:.92;font-size:15px}
.bar{position:sticky;top:0;z-index:50;background:#fff;
  border-bottom:1px solid var(--line);padding:9px 0}
.bar .wrap{display:flex;align-items:center;gap:12px}
.prog{flex:1;height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ink);transition:width .35s}
.pct{font-size:13px;color:var(--muted);font-weight:600;min-width:76px;text-align:left}
.card{background:var(--canvas);border:1px solid var(--line);border-radius:16px;padding:20px 18px;margin-bottom:16px}
h2{font-size:20px;color:var(--ink);margin:0 0 6px;border-bottom:1px solid var(--line);padding-bottom:8px;font-weight:700}
h2 small{display:block;font-size:13px;color:var(--muted);font-weight:400;border:0;margin-top:5px}
.q{margin:20px 0 0;padding-top:16px;border-top:1px dashed var(--line)}
.q:first-of-type{border-top:0;padding-top:0}
.q .t{font-weight:500;font-size:16px;margin-bottom:3px}
.q .t b{color:var(--warn)}
.q .h{font-size:13.5px;color:var(--muted);margin-bottom:9px;line-height:1.65}
input[type=text],textarea,select{width:100%;border:1.5px solid var(--line);border-radius:8px;
  padding:11px 12px;font-family:inherit;font-size:15.5px;background:var(--softer);color:var(--ink);outline:none}
textarea{min-height:88px;resize:vertical;line-height:1.75}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(0,0,0,.08)}
label.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1.5px solid var(--line);
  border-radius:10px;margin-bottom:7px;cursor:pointer;background:#fff;transition:.15s;font-size:15px}
label.opt:hover{border-color:var(--ink);background:var(--softer)}
label.opt input{margin-top:5px;accent-color:var(--ink);width:17px;height:17px;flex:none}
label.opt.on{border-color:var(--ink);background:var(--soft);font-weight:500}
.note{background:var(--soft);border-right:5px solid var(--ink);border-radius:8px;padding:12px 14px;
  margin:12px 0;font-size:14.5px;color:var(--muted)}
.note.red{background:var(--warn-bg);border-right-color:var(--warn);color:var(--warn-text)}
.note.grn{background:var(--ok-bg);border-right-color:var(--ok);color:var(--ok)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.tbl th{background:var(--ink);color:#fff;padding:9px 6px;font-weight:500;font-size:13px;text-align:center}
.tbl td{border:1px solid var(--line);padding:6px;vertical-align:middle}
.tbl tr:nth-child(even) td{background:var(--softer)}
.tbl input[type=text]{padding:7px 8px;font-size:14px;border-width:1px}
.tbl select{padding:7px 4px;font-size:14px;border-width:1px;text-align:center}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -6px;padding:0 6px}
.leg{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:2px 0 10px;background:var(--softer)}
.leg .lg-h{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:6px}
.leg .lg-r{display:flex;gap:9px;align-items:flex-start;padding:6px 0;border-top:1px dashed var(--line);

.leg .lg-r:first-of-type{border-top:0;padding-top:0}
.leg .lg-r b{background:var(--ink);color:#fff;border-radius:6px;min-width:22px;height:22px;flex:none;

.leg.rng .lg-r b{min-width:46px;border-radius:8px;padding:0 7px;font-size:12px}
h2 .tm{float:left;background:var(--soft);color:var(--muted);border-radius:999px;

.tbl select[data-k="c"]{min-width:132px}
.sc td:first-child{text-align:right;font-weight:600;font-size:13.5px;min-width:190px;background:#fff!important}
.sc select{background:var(--soft);min-width:62px}
.sc .res{font-weight:700;color:var(--ink);text-align:center;font-size:15px;background:var(--soft)!important}
.sc .rnk{text-align:center;font-weight:700;color:var(--ok);background:var(--ok-bg)!important}
.desc{font-size:12.5px;color:var(--muted);font-weight:400;line-height:1.55;display:block;margin-top:3px}
.foot{position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid var(--line);
  padding:11px 0;z-index:60;box-shadow:var(--shadow)}
.foot .wrap{display:flex;gap:9px;align-items:center}
button{font-family:inherit;font-weight:500;font-size:15px;border:0;border-radius:999px;padding:13px 16px;cursor:pointer;transition:.15s}
.b1{background:var(--ink);color:#fff;flex:1}
.b1:hover{background:var(--elev)}
.b2{background:#fff;color:var(--ink);border:1.5px solid var(--line);padding:12px 14px}
.b2:hover{border-color:var(--ink)}
.bw{background:#25D366;color:#fff;flex:1}
.bw:hover{background:#1eb356}

.svc{border:1.5px solid var(--line);border-radius:12px;padding:13px 13px 10px;margin-bottom:12px;background:#fff}
.svc.full{border-color:var(--ink);background:var(--softer)}
.sh{display:flex;gap:9px;align-items:flex-start;font-weight:700;font-size:15.5px;color:var(--ink);line-height:1.5}
.sh .num{background:var(--ink);color:#fff;border-radius:7px;min-width:25px;height:25px;display:flex;
  align-items:center;justify-content:center;font-size:13px;flex:none;margin-top:2px}
.sd{font-size:13px;color:var(--muted);line-height:1.6;margin:7px 0 11px}
.row{display:flex;align-items:center;gap:9px;padding:6px 0;border-top:1px dashed var(--line)}
.row:first-child{border-top:0}
.row span{flex:1;font-size:13.5px;line-height:1.45}
.row span i{display:block;font-style:normal;font-size:11.5px;color:var(--muted)}
.row select{width:78px;flex:none;background:var(--softer);border:1.5px solid var(--line);
  border-radius:9px;padding:9px 6px;font-size:15px;font-weight:700;text-align:center;color:var(--ink)}
.row select.set{background:var(--soft);border-color:var(--ink)}
.sf{margin-top:9px;padding-top:9px;border-top:1.5px solid var(--line);display:flex;
  justify-content:space-between;font-size:13.5px;color:var(--muted)}
.sf b{color:var(--ink);font-size:16px}
.sf .rk b{color:var(--ok)}

.hide{display:none!important}
#done{text-align:center;padding:26px 18px}
#done h2{border:0;font-size:23px}
.steps{text-align:right;max-width:520px;margin:16px auto 0}
.steps li{margin-bottom:11px;font-size:15.5px}
.err{border-color:var(--warn)!important;background:#fff8f8}
.errmsg{color:var(--warn);font-size:13.5px;font-weight:600;margin-top:6px;display:none}
.miss{background:var(--warn-bg);border-right:5px solid var(--warn);border-radius:8px;padding:11px 14px;
  margin:10px 0;font-size:14px;color:var(--warn-text);font-weight:600}
@media(max-width:520px){
  header h1{font-size:22px} h2{font-size:17px} body{font-size:15px}
  .card{padding:16px 13px} .sc td:first-child{min-width:150px;font-size:12.5px}
  .foot button{font-size:14px;padding:12px 10px}
}
</style>
</head>

const D={};

let doneShown=false;
let _saveT=null;
function hasData(){return Object.keys(D).some(k=>{const v=D[k];if(v==null)return false;if(Array.isArray(v))return v.some(x=>x&&(typeof x==='object'?Object.values(x).some(y=>y!==''&&y!==null):!!x));if(typeof v==='object')return Object.values(v).some(x=>!!x);return String(v).trim().length>0})}
function autosave(){
  clearTimeout(_saveT);
  _saveT=setTimeout(()=>{try{localStorage.setItem(DRAFT_KEY,JSON.stringify(D))}catch(e){}},500);
}
window.addEventListener('beforeunload',e=>{
  if(!doneShown&&hasData()){e.preventDefault();e.returnValue=''}
});

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function calc(){
  const S=D.score;const tot=[];
  S.forEach((r,i)=>{
    const full=r.every(x=>x!==null&&x!=='');
    const v=full?r.reduce((a,x,j)=>a+x*CRIT[j][1],0):null;
    tot.push(v);
    document.getElementById('res'+i).textContent=v===null?'—':v.toFixed(2);
    document.getElementById('svc'+i).classList.toggle('full',full);
  });
  const valid=tot.filter(x=>x!==null).slice().sort((a,b)=>b-a);
  tot.forEach((v,i)=>{document.getElementById('rnk'+i).textContent=v===null?'—':(valid.indexOf(v)+1)});
  const fw=document.getElementById('flatWarn');
  if(fw)fw.classList.toggle('hide',!isFlat(S));
}

/* (6) نفس الدرجة بأكثر من 15 خدمة على نفس المعيار = تعبئة بلا تفكير */
function isFlat(S){
  return CRIT.some((c,j)=>{
    const cnt={};let mx=0;
    S.forEach(r=>{const x=r[j];if(x!==null&&x!==''){cnt[x]=(cnt[x]||0)+1;if(cnt[x]>mx)mx=cnt[x]}});
    return mx>15;
  });
}

function allQ(){const a=[];F.forEach(s=>s.q.forEach(q=>a.push(q)));return a}

function filled(q){
  const v=D[q.id];
  if(q.ty==='skills')return v&&v.filter(x=>x.v).length>=8;
  if(q.ty==='eng')return v&&v.filter(Boolean).length===3;
  if(q.ty==='net')return v&&v.filter(x=>x.n&&x.n.trim()).length>=10;
  if(q.ty==='score')return v&&v.filter(r=>r.every(x=>x!==null&&x!=='')).length===SVC.length;
  if(q.ty==='check')return v&&v.length>0;
  return v&&String(v).trim().length>0;
}

function prog(){
  const qs=allQ().filter(q=>q.req);const n=qs.filter(filled).length;
  const p=Math.round(n/qs.length*100);
  document.getElementById('pi').style.width=p+'%';
  document.getElementById('pt').textContent=p+'%  ('+n+'/'+qs.length+')';
  autosave();
}

function finish(){
  const bad=allQ().filter(q=>q.req&&!filled(q));
  document.querySelectorAll('.errmsg').forEach(e=>e.style.display='none');
  document.querySelectorAll('.miss').forEach(e=>e.remove());
  if(bad.length){
    bad.forEach(q=>{const e=document.getElementById('err_'+q.id);if(e){
      e.style.display='block';
      e.textContent = q.ty==='net' ? 'لازم 10 أسماء على الأقل — هذا القسم اللي بينتج عملاء'
        : q.ty==='score' ? 'لازم تقيّم الـ20 خدمة كاملة على المعايير الخمسة'
        : q.ty==='skills' ? 'قيّم 8 مهارات على الأقل'
        : 'هذا السؤال مطلوب';}});
    const m=el('<div class="miss">في '+bad.length+' سؤال ناقص. الأسئلة الناقصة معلّمة بالأحمر فوق.</div>');
    document.getElementById('after').appendChild(m);
    const f=document.getElementById('box_'+bad[0].id);
    if(f)f.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }
  const md=buildMD();
  dl(md,safeName());
  try{localStorage.removeItem(DRAFT_KEY)}catch(e){}
  showDone();
}

function cell(s){return String(s==null?'':s).replace(/\|/g,'\\|').replace(/\n/g,' ')}

/* ===== (5) ملخص تنفيذي: كله محسوب من إجابات موجودة، بلا أسئلة زيادة ===== */
function netRows(){return (D.q13||[]).filter(r=>r&&r.n&&r.n.trim())}
function sectorCount(){
  const cnt={};netRows().forEach(r=>{if(r.c)cnt[r.c]=(cnt[r.c]||0)+1});
  return Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
}
function nAsma(k){return k===1?'اسم واحد':k===2?'اسمين':(k<=10?k+' أسماء':k+' اسم')}
function scoreRanked(){
  const v=D.score||[];
  return SVC.map((sv,i)=>({n:sv.n,r:v[i]||[],t:(v[i]||[]).every(x=>x!==null&&x!=='')?v[i].reduce((a,x,j)=>a+x*CRIT[j][1],0):null}))
    .filter(x=>x.t!==null).sort((a,b)=>b.t-a.t);
}
function summaryMD(){
  const L=[];const sc=sectorCount();const rk=scoreRanked();
  L.push('## ملخص تنفيذي');L.push('');
  L.push('| البند | الجواب |');L.push('|---|---|');
  L.push('| الساعات الأسبوعية | '+cell(D.q5||'—')+' |');
  L.push('| بيحط من ماله | '+cell(D.q10||'—')+' |');
  L.push('| بيصمد بلا دخل | '+cell(D.q11||'—')+' |');
  L.push('| الحد الأدنى الشهري للنجاح | '+cell(D.q12||'—')+' |');
  L.push('| عدد الأسماء بالشبكة | '+netRows().length+' |');
  L.push('| القطاع الأغلب | '+(sc.length?cell(sc[0][0])+' ('+nAsma(sc[0][1])+')':'—')+' |');
  L.push('| أعلى 3 خدمات عنده | '+(rk.length?rk.slice(0,3).map((r,i)=>(i+1)+') '+cell(r.n)).join(' · '):'—')+' |');
  L.push('| رشّح حاله للمبيعات | '+cell(D.q17||'—')+' |');
  L.push('| مستعد لـ3 عملاء بسعر رمزي | '+cell(D.q30||'—')+' |');
  L.push('| لو إجته وظيفة بعد 3 شهور | '+cell(D.q8||'—')+' |');
  if(D.score&&isFlat(D.score))L.push('| ⚠️ تنبيه | حطّ نفس الدرجة بأكثر من 15 خدمة على نفس المعيار — راجع تقييمه بحذر |');
  L.push('');L.push('---');L.push('');
  return L;
}

function buildMD(){
  const L=[];
  L.push('# بكاسل — استمارة الشريك');L.push('');
  L.push('**الاسم:** '+(D.name||''));
  L.push('**واتساب:** '+(D.wa||''));
  L.push('**التاريخ:** '+(D.date||''));
  L.push('');L.push('---');L.push('');
  summaryMD().forEach(x=>L.push(x));
  F.forEach(sec=>{
    if(sec.s==='بياناتك')return;
    L.push('## '+sec.s);L.push('');
    sec.q.forEach(q=>{
      L.push('**'+q.t+'**');L.push('');
      const v=D[q.id];
      if(q.ty==='skills'){
        L.push('| المهارة | من 5 | مشروع حقيقي؟ |');L.push('|---|:---:|:---:|');
        SKILLS.forEach((s,i)=>L.push('| '+s+' | '+(v[i].v||'—')+' | '+(v[i].r||'—')+' |'));
      }else if(q.ty==='eng'){
        L.push('| المهارة | المستوى |');L.push('|---|:---:|');
        ENG.forEach((s,i)=>L.push('| '+s+' | '+(v[i]||'—')+' |'));
      }else if(q.ty==='net'){
        L.push('| # | الاسم | القطاع | النشاط | الصلة | قوة العلاقة |');L.push('|:---:|---|---|---|---|:---:|');
        let k=0;v.forEach(r=>{if(r.n&&r.n.trim()){k++;L.push('| '+k+' | '+cell(r.n)+' | '+cell(r.c||'—')+' | '+cell(r.b||'')+' | '+cell(r.s||'')+' | '+cell(r.p||'')+' |')}});
        L.push('');L.push('*مجموع الأسماء: '+k+'*');L.push('');
        const sc=sectorCount();
        if(sc.length){
          L.push('**توزيع القطاعات:**');L.push('');
          L.push('| القطاع | عدد الأسماء |');L.push('|---|:---:|');
          sc.forEach(x=>L.push('| '+cell(x[0])+' | '+x[1]+' |'));
        }
      }else if(q.ty==='score'){
        const rows=SVC.map((s,i)=>({n:s.n,r:v[i],t:v[i].reduce((a,x,j)=>a+x*CRIT[j][1],0)}));
        const sorted=rows.slice().sort((a,b)=>b.t-a.t);
        L.push('| الترتيب | الخدمة | '+CRIT.map(c=>c[0]).join(' | ')+' | النتيجة |');
        L.push('|:---:|---|'+CRIT.map(()=>':---:').join('|')+'|:---:|');
        sorted.forEach((r,i)=>L.push('| '+(i+1)+' | '+r.n+' | '+r.r.join(' | ')+' | '+r.t.toFixed(2)+' |'));
        L.push('');
        L.push('**أعلى 5 خدمات عندي:** '+sorted.slice(0,5).map((r,i)=>(i+1)+') '+r.n).join(' · '));
        L.push('');
        L.push('**أدنى 3 خدمات عندي:** '+sorted.slice(-3).map(r=>r.n).join(' · '));
      }else if(q.ty==='check'){
        (v&&v.length?v:['—']).forEach(x=>L.push('- '+x));
      }else{
        L.push((v&&String(v).trim())?String(v).split('\n').map(x=>'> '+x).join('\n'):'> —');
      }
      L.push('');
    });
    L.push('---');L.push('');
  });
  L.push('*تم التعبئة عبر نموذج بكاسل.*');
  return L.join('\n');
}

/* كروم بيحذف الأحرف العربية من اسم ملف التنزيل، فمنحوّلها لحروف لاتينية */
const AR2LAT={'ا':'a','أ':'a','إ':'i','آ':'a','ب':'b','ت':'t','ث':'th','ج':'j','ح':'h','خ':'kh',
'د':'d','ذ':'th','ر':'r','ز':'z','س':'s','ش':'sh','ص':'s','ض':'d','ط':'t','ظ':'z','ع':'a','غ':'gh',
'ف':'f','ق':'q','ك':'k','ل':'l','م':'m','ن':'n','ه':'h','ة':'a','و':'w','ؤ':'o','ي':'y','ى':'a','ئ':'e','ء':'','\u0640':''};
function translit(str){
  return String(str||'').split('').map(ch=>{
    if(AR2LAT[ch]!==undefined)return AR2LAT[ch];
    if(/[\u064B-\u0652]/.test(ch))return '';
    if(/[A-Za-z0-9]/.test(ch))return ch;
    if(/\s|[-_]/.test(ch))return '-';
    return '';
  }).join('').replace(/-+/g,'-').replace(/^-|-$/g,'');
}
function safeName(){
  const n=translit(D.name)||'Partner';
  return 'Bkasel-'+n+'.md';
}
function dl(txt,fn){
  const b=new Blob(['﻿'+txt],{type:'text/markdown;charset=utf-8'});
  const u=URL.createObjectURL(b);const a=document.createElement('a');
  a.href=u;a.download=fn;document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(u)},900);
}

function saveDraft(){
  dl(JSON.stringify(D),'Bkasel-draft.json');
  alert('انحفظت المسودة كملف. لما ترجع، اضغط "استعادة" واختار نفس الملف.');
}
function loadDraft(){
  const i=document.createElement('input');i.type='file';i.accept='.json';
  i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{Object.assign(D,JSON.parse(r.result));location.hash='';apply();alert('انستعادت المسودة.')}catch(x){alert('الملف مش صالح.')}};
    r.readAsText(f)};
  i.click();
}
function apply(){
  allQ().forEach(q=>{
    const v=D[q.id];if(v==null)return;
    if(q.ty==='text'||q.ty==='area'){const n=document.getElementById(q.id);if(n)n.value=v}
    else if(q.ty==='radio'||q.ty==='check'){
      document.querySelectorAll('[name="'+q.id+'"]').forEach(inp=>{
        const on=q.ty==='radio'?inp.value===v:(v||[]).indexOf(inp.value)>=0;
        inp.checked=on;inp.closest('label').classList.toggle('on',on)})}
    else{
      const box=document.getElementById('box_'+q.id);if(!box)return;
      if(q.ty==='skills'||q.ty==='net'){box.querySelectorAll('[data-i]').forEach(n=>{
        const o=v[+n.dataset.i];if(o)n.value=o[n.dataset.k]||''})}
      else if(q.ty==='eng'){box.querySelectorAll('input').forEach(n=>{n.checked=(v[+n.dataset.i]===n.value)})}
      else if(q.ty==='score'){box.querySelectorAll('select').forEach(n=>{
        const row=v[+n.dataset.i];const x=row?row[+n.dataset.j]:null;n.value=(x==null?'':x);
        n.classList.toggle('set',!!n.value)});calc()}
    }
  });
  prog();
}

    '<ol class="steps">'+

    '<li>اختار الملف <b>'+safeName()+'</b> من التنزيلات.</li>'+
    '<li>ابعته. خلص. 🎯</li>'+
    '</ol>'+
    '<div style="display:flex;gap:9px;margin-top:20px;flex-wrap:wrap">'+

    '<button class="b2" id="re">تنزيل الملف مرة تانية</button>'+
    '</div>'+
    '<p style="color:var(--muted);font-size:13px;margin-top:14px">لو ما فتح واتساب، ابعت الملف يدويًا لـ '+FADI_NAME+'.</p>'+

  document.getElementById('after').appendChild(d);
