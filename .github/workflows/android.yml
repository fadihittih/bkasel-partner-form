# Builds the Android APK on every push that touches android/, and on demand.
# Download it from the run's "Artifacts" section.
name: Android APK

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Keep the same debug signing key between builds so updates install over
      # the previous version (Android refuses updates signed with a different key).
      - name: Restore debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/HealthSync-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HealthSync-apk
          path: android/app/build/HealthSync-debug.apk
          retention-days: 30
